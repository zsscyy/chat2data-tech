# chat2Data 用户子服务配置文件（gflags flagfile 格式，每行 --key=value）
# 使用方式：./UserService --conf=chat2Data.conf

# ---------- 日志配置 ----------
--log_level=2
--log_path=stdout
--log_format=[%H:%M:%S][%-7l]: %v
--log_async=false

# ---------- 注册中心 ----------
--etcd_addr=http://dev-etcd:2379

# ---------- MySQL 配置 ----------
# 容器名为 dev-mysql（注意不是 dev-msyql）
--mysql_host=dev-mysql
--mysql_port=3306
--mysql_user=root
--mysql_passwd=123456
--mysql_db=chat2Data
--mysql_charset=utf8mb4

# ---------- Redis 配置 ----------
--redis_host=dev-redis
--redis_port=6379
--redis_passwd=123456
--redis_db=0
--redis_pool_size=16

# ---------- 用户子服务 RPC 配置 ----------
# 必须填其他容器可达的地址；不要填 127.0.0.1，否则 etcd 注册地址不可用
--service_addr=dev-env-service
--listen_port=9100
--service_name=UserService

# ---------- 依赖的子服务名称（本章未实现，仅用于预留 RPC 信道） ----------
--notify_service=NotifyService
--db_service=DatabaseService

# ---------- 通知子服务 RPC 配置 ----------
# 使用 notify_ 前缀，避免与用户子服务的 listen_port/service_name/service_addr 冲突
# 使用容器名而不是硬编码 IP：容器重启/IP 变化后 Docker DNS 仍能解析
--notify_listen_port=9002
--notify_service_name=NotifyService
--notify_service_addr=dev-env-service

# ---------- Excel解析子服务 RPC 配置 ----------
# 使用容器名而不是硬编码 IP：容器重启/IP 变化后 Docker DNS 仍能解析
--excel_listen_port=9003
--excel_service_name=ExcelParserService
--excel_service_addr=dev-env-service

# ---------- FastDFS 配置（Excel解析子服务） ----------
--fdfs_trackers=dev-tracker:22122
--fdfs_connect_timeout=30
--fdfs_network_timeout=30

# ---------- 邮箱配置（通知子服务） ----------
--mail_username=17726854439@163.com
--mail_password=PPR9LQfPQCL98kkT
--mail_url=smtps://smtp.163.com:465
--mail_from=17726854439@163.com

# ---------- 文件子服务 RPC 配置 ----------
# 使用 file_ 前缀，避免与用户子服务的 listen_port/service_name/service_addr 冲突
# 必须填其他容器可达的地址；不要填 127.0.0.1，否则 etcd 注册地址不可用
--file_service_addr=dev-env-service
--file_listen_port=9004
--file_service_name=FileService

# ---------- 文件子服务依赖的子服务名称 ----------
--excel_service=ExcelParserService
--db_service=DatabaseService
--ai_service=AIService
