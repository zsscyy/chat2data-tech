# chat2Data 用户子服务配置文件（gflags flagfile 格式，每行 --key=value）
# 使用方式：./UserService --conf=chat2Data.conf

# ---------- 日志配置 ----------
--log_level=2
--log_path=stdout
--log_format=[%H:%M:%S][%-7l]: %v
--log_async=false

# ---------- 注册中心 ----------
--etcd_addr=http://dev-etcd:2379

# ---------- MySQL 配置 ----------
# 容器名为 dev-mysql（注意不是 dev-msyql）
--mysql_host=dev-mysql
--mysql_port=3306
--mysql_user=root
--mysql_passwd=123456
--mysql_db=chat2Data
--mysql_charset=utf8mb4

# ---------- Redis 配置 ----------
--redis_host=dev-redis
--redis_port=6379
--redis_passwd=123456
--redis_db=0
--redis_pool_size=16

# ---------- 用户子服务 RPC 配置 ----------
# 本地同机调试地址；多容器/多主机部署时改成其他服务可达的主机名或IP。
--service_addr=127.0.0.1
--listen_port=9100
--service_name=UserService

# ---------- 依赖的子服务名称（本章未实现，仅用于预留 RPC 信道） ----------
--notify_service=NotifyService
--db_service=DatabaseService

# ---------- 通知子服务 RPC 配置 ----------
# 使用 notify_ 前缀，避免与用户子服务的 listen_port/service_name/service_addr 冲突
--notify_listen_port=9002
--notify_service_name=NotifyService
--notify_service_addr=172.18.0.8

