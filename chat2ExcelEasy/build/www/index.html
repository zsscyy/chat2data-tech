<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat2Excel · 基于AI的Excel数据分析助手</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="app">
        <!-- 页面头部：标题、功能介绍、文件选择 -->
        <header class="site-header">
            <div class="brand">
                <div class="brand-logo" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                        <path d="M3 9.5h18M9.5 9.5V20M3 15h18"></path>
                    </svg>
                </div>
                <h1 class="brand-title">Chat2Excel</h1>
                <span class="status-pill" id="statusPill">
                    <i></i><span id="statusText">正在连接…</span>
                </span>
            </div>
            <p class="brand-subtitle">基于AI的Excel数据分析助手，上传您的Excel文件，即可获得智能化的数据分析和建议</p>

            <div class="file-row">
                <button type="button" class="btn-select" id="selectFileBtn">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 16V4"></path>
                        <path d="m7 9 5-5 5 5"></path>
                        <path d="M5 20h14"></path>
                    </svg>
                    <span>选择文件</span>
                </button>
                <input type="text" class="file-path" id="filePathInput" readonly
                       placeholder="尚未选择文件，仅支持 .xlsx 格式">
                <span class="file-state" id="fileState" hidden></span>
            </div>
            <input type="file" id="filePicker" accept=".xlsx" hidden>
        </header>

        <!-- 消息展示区域 -->
        <main class="chat-area" id="chatArea">
            <div class="welcome" id="welcome">
                <div class="welcome-icon" aria-hidden="true">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19V9M10 19V5M16 19v-7M22 19V3"></path>
                        <path d="M2 22h22"></path>
                    </svg>
                </div>
                <h2>上传 Excel，开始智能分析</h2>
                <p class="welcome-tip">先选择并上传 .xlsx 文件，再输入您想了解的问题，AI 将结合表格数据给出分析结果与建议。</p>
                <div class="welcome-chips">
                    <button type="button" class="chip" data-q="分析这个Excel文件的整体情况">分析整体情况</button>
                    <button type="button" class="chip" data-q="找出数据中的关键趋势和异常">找出关键趋势</button>
                    <button type="button" class="chip" data-q="基于数据给出改进建议">给出改进建议</button>
                </div>
            </div>
            <div class="message-list" id="messageList"></div>
        </main>

        <!-- 输入区域 -->
        <footer class="composer">
            <div class="composer-box">
                <textarea id="messageInput" rows="1" maxlength="2000"
                          placeholder="请输入您的消息...(Enter发送，Shift+Enter换行)"></textarea>
                <button type="button" class="btn-send" id="sendBtn" title="发送" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2 11 13"></path>
                        <path d="M22 2 15 22l-4-9-9-4Z"></path>
                    </svg>
                </button>
            </div>
            <div class="composer-foot">
                <span class="composer-tip">Enter 发送 · Shift+Enter 换行</span>
                <span class="char-count" id="charCount">0 / 2000</span>
            </div>
        </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./js/markdown.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
